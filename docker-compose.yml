services:
  postgres:
    image: postgres:16
    container_name: iot_postgres
    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: iot_redis
    ports:
      - "6380:6379"

volumes:
  postgres_data: