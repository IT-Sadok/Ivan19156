name: CD
on:
  workflow_dispatch:
jobs:
  build-and-push-monolith:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/iot-api:${{ github.sha }}

  build-and-push-telemetry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: src/services/TelemetryService/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/telemetry-service:${{ github.sha }}

  build-and-push-maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: src/services/MaintenanceService/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/maintenance-service:${{ github.sha }}

  build-and-push-device:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: src/services/DeviceService/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/device-service:${{ github.sha }}

  deploy:
    needs: [build-and-push-monolith, build-and-push-telemetry, build-and-push-maintenance, build-and-push-device]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      - name: Set image tags
        run: |
          sed -i 's|#{IMAGE_TAG}#|${{ github.sha }}|g' k8s/deployment.yaml
          sed -i 's|#{IMAGE_TAG}#|${{ github.sha }}|g' k8s/telemetry/deployment.yaml
          sed -i 's|#{IMAGE_TAG}#|${{ github.sha }}|g' src/services/DeviceService/k8s/deployment.yaml
          sed -i 's|#{IMAGE_TAG}#|${{ github.sha }}|g' src/services/MaintenanceService/k8s/deployment.yaml
      - name: Deploy monolith
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout restart deployment/iot-api
      - name: Deploy telemetry service
        run: |
          kubectl apply -f k8s/telemetry/configmap.yaml
          kubectl apply -f k8s/telemetry/deployment.yaml
          kubectl apply -f k8s/telemetry/service.yaml
          kubectl rollout restart deployment/telemetry-service
      - name: Deploy device service
        run: |
          kubectl apply -f src/services/DeviceService/k8s/configmap.yaml
          kubectl apply -f src/services/DeviceService/k8s/secret.yaml
          kubectl apply -f src/services/DeviceService/k8s/deployment.yaml
          kubectl apply -f src/services/DeviceService/k8s/service.yaml
          kubectl rollout restart deployment/device-service
      - name: Deploy maintenance service
        run: |
          kubectl apply -f src/services/MaintenanceService/k8s/configmap.yaml
          kubectl apply -f src/services/MaintenanceService/k8s/secret.yaml
          kubectl apply -f src/services/MaintenanceService/k8s/deployment.yaml
          kubectl apply -f src/services/MaintenanceService/k8s/service.yaml
          kubectl rollout restart deployment/maintenance-service