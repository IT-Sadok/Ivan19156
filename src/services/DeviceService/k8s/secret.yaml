apiVersion: v1
kind: Secret
metadata:
  name: device-service-secret
type: Opaque
stringData:
  ConnectionStrings__Default: "Host=your-pg-server;Database=iot;Username=iot_user;Password=your-password"
  ConnectionStrings__Redis: "your-redis:6380,password=your-redis-password,ssl=True"
  Kafka__ConnectionString: "your-eventhub-connection-string"
  Jwt__Key: "your-jwt-signing-key-here"
  Jwt__Issuer: "your-issuer"
  Jwt__Audience: "your-audience"
