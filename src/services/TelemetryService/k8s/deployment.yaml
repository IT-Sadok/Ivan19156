apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-service
  template:
    metadata:
      labels:
        app: telemetry-service
    spec:
      containers:
        - name: telemetry-service
          image: iotregistryi.azurecr.io/telemetry-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: telemetry-service-config
            - secretRef:
                name: telemetry-service-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"