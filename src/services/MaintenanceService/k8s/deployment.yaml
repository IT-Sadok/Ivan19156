apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance-service
  template:
    metadata:
      labels:
        app: maintenance-service
    spec:
      containers:
        - name: maintenance-service
          image: iotregistryi.azurecr.io/maintenance-service:#{IMAGE_TAG}#
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: maintenance-service-config
            - secretRef:
                name: maintenance-service-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"