apiVersion: v1
kind: Secret
metadata:
  name: maintenance-service-secret
type: Opaque
stringData:
  ConnectionStrings__Default: "Host=your-pg-server;Database=iot_db;Username=iot_user;Password=your-password"
  Kafka__ConnectionString: "your-eventhub-connection-string"
  Jwt__Key: "your-jwt-secret-key"
  AzureAI__Endpoint: "https://your-openai.openai.azure.com/"
  AzureAI__ApiKey: "your-azure-openai-api-key"